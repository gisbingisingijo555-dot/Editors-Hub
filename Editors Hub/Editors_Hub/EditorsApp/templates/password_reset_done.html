{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Email Sent</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        video {
            position: fixed;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(5px) brightness(60%);
            z-index: -1;
        }

        .box {
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            line-height: 1.6;
        }

        a {
            color: #4facfe;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <video autoplay muted loop>
        <source src="{% static 'videos/background.mp4' %}" type="video/mp4">
    </video>

    <div class="box">

        <h1>Email Sent</h1>

        <p>
            We’ve emailed you instructions for setting your password.
        </p>

        <p>
            Check your inbox and spam folder.
        </p>

        <a href="/login/">Back to Login</a>

    </div>

</body>

</html>
