{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
        }

        /* Background Video */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(5px) brightness(55%);
            z-index: -1;
        }

        /* Glass Box */
        .reset-box {
            width: 420px;
            padding: 40px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            color: white;
        }

        .reset-box h2 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .reset-box p {
            text-align: center;
            font-size: 15px;
            color: #d6d6d6;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Labels */
        .input-label {
            display: block;
            margin-bottom: 8px;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 600;
            color: #f1f1f1;
        }

        /* Input */
        .reset-box input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.92);
            color: #111;
            transition: 0.3s;
        }

        .reset-box input:focus {
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.3);
        }

        /* Button */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4facfe, #00c6fb);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.35);
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loader {
            display: none;
        }

        /* Error List */
        .errorlist {
            margin-top: 10px;
            padding-left: 18px;
            color: #ffb3b3;
            font-size: 13px;
        }

        /* Back Link */
        .back-login {
            text-align: center;
            margin-top: 22px;
        }

        .back-login a {
            color: #4facfe;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .back-login a:hover {
            color: #82cfff;
        }

        @media (max-width: 500px) {
            .reset-box {
                width: 90%;
                padding: 30px 22px;
            }

            .reset-box h2 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <!-- Background Video -->
    <video autoplay muted loop>
        <source src="{% static 'videos/background.mp4' %}" type="video/mp4">
    </video>

    <!-- Forgot Password Box -->
    <div class="reset-box">

        <h2>Forgot Password</h2>

        <p>
            Enter your registered email address below.
            We’ll send you a password reset link.
        </p>

        <form method="POST" onsubmit="return disableButton()">

            {% csrf_token %}

            <label class="input-label">
                Email Address
            </label>

            {{ form.email }}

            {{ form.errors }}

            <button type="submit" id="resetBtn">

                <span id="btnText">
                    Send Reset Link
                </span>

                <span id="loader" class="loader">
                    Sending...
                </span>

            </button>

        </form>

        <div class="back-login">
            <a href="/login/">
                ← Back to Login
            </a>
        </div>

    </div>

    <script>

        function disableButton() {

            let btn = document.getElementById("resetBtn");
            let text = document.getElementById("btnText");
            let loader = document.getElementById("loader");

            btn.disabled = true;

            text.style.display = "none";
            loader.style.display = "inline";

            return true;
        }

    </script>

</body>

</html>
