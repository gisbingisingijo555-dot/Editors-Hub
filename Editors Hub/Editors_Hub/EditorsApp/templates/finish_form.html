<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Submit Work</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #090d16;
            --card-bg: rgba(30, 41, 59, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --text-muted: #94a3b8;
        }

        body {
            background: radial-gradient(circle at top, #0f172a, #020617);
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CARD */
        .form-card {
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 18px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }

        /* INPUTS */
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 10px;
            padding: 12px;
            transition: 0.25s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            color: #fff;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        /* BUTTON */
        .btn-submit {
            width: 100%;
            background: #f59e0b;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-submit:hover {
            background: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
        }

        /* ICON INPUT STYLE */
        .input-group-text {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #94a3b8;
        }

        /* SMALL ANIMATION ON LOAD */
        .form-group {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.4s ease forwards;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.2s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.35s;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="form-card">
        <h2><i class="bi bi-cloud-upload-fill me-2 text-warning"></i>Submit Completed Work</h2>

        <form method="POST">
            {% csrf_token %}

            <!-- DRIVE LINK -->
            <div class="form-group mb-3">
                <label>Drive Link</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
                    <input type="url" name="drive_link" required class="form-control"
                        placeholder="Paste Google Drive link">
                </div>
            </div>

            <!-- AMOUNT -->
            <div class="form-group mb-3">
                <label>Amount (₹)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-currency-rupee"></i></span>
                    <input type="number" name="amount" required class="form-control" placeholder="Enter amount">
                </div>
            </div>

            <!-- BUTTON -->
            <button class="btn btn-submit mt-2">
                <i class="bi bi-check-circle me-2"></i>Submit Work
            </button>

        </form>
    </div>

</body>

</html>
