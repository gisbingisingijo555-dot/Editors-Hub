{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(5px) brightness(60%);
            z-index: -1;
        }

        .box {
            width: 350px;
            padding: 40px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 600;
            color: white;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #2f80ed;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            color: #4facfe;
            text-decoration: none;
        }

        ul {
            font-size: 13px;
            color: #ffb3b3;
            padding-left: 20px;
        }

        .errorlist {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <video autoplay muted loop>
        <source src="{% static 'videos/background.mp4' %}" type="video/mp4">
    </video>

    <div class="box">

        <h2>Change Password</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label for="id_old_password">Current Password</label>
                {{ form.old_password }}
            </div>

            <div class="input-group">
                <label for="id_new_password1">New Password</label>
                {{ form.new_password1 }}
            </div>

            <div class="input-group">
                <label for="id_new_password2">Confirm New Password</label>
                {{ form.new_password2 }}
            </div>

            {{ form.errors }}

            <button type="submit">
                Update Password
            </button>
        </form>

        <div class="back">
            <a href="/user-profile/">← Back to Profile</a>
        </div>

    </div>

</body>

</html>
