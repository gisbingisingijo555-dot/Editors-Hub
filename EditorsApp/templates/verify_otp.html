{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: #020617;
        }

        /* =========================
           Animated Background
        ========================== */

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .5;
            animation: float 12s ease-in-out infinite;
        }

        .orb1 {
            width: 350px;
            height: 350px;
            background: #2563eb;
            top: -80px;
            left: -80px;
        }

        .orb2 {
            width: 300px;
            height: 300px;
            background: #7c3aed;
            bottom: -80px;
            right: -50px;
            animation-delay: 3s;
        }

        .orb3 {
            width: 220px;
            height: 220px;
            background: #06b6d4;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 6s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-30px);
            }
        }

        /* =========================
           OTP Card
        ========================== */

        .card {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 460px;

            padding: 35px;

            border-radius: 28px;

            background: rgba(15, 23, 42, .72);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, .08);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, .55),
                inset 0 1px 1px rgba(255, 255, 255, .05);

            color: white;

            animation: fadeUp .7s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: auto;
            margin-bottom: 20px;

            border-radius: 22px;

            background: linear-gradient(135deg,
                    #38bdf8,
                    #2563eb,
                    #7c3aed);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
            font-weight: 700;

            box-shadow: 0 10px 25px rgba(37, 99, 235, .4);
        }

        h3 {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* =========================
           Alerts
        ========================== */

        .alert {
            border: none;
            border-radius: 12px;
            font-size: 14px;
        }

        /* =========================
           OTP BOXES
        ========================== */

        .otp-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 25px 0;
        }

        .otp-box {
            width: 55px;
            height: 60px;

            border-radius: 14px;

            border: 1px solid rgba(255, 255, 255, .08);

            background: rgba(255, 255, 255, .04);

            color: white;

            font-size: 24px;
            font-weight: 700;

            text-align: center;

            transition: .25s ease;

            caret-color: #38bdf8;
        }

        .otp-box:focus {
            outline: none;

            border-color: #38bdf8;

            transform: translateY(-3px);

            box-shadow:
                0 0 0 3px rgba(56, 189, 248, .15),
                0 0 20px rgba(56, 189, 248, .4);
        }

        /* =========================
           Verify Button
        ========================== */

        .btn-primary {
            border: none;
            border-radius: 14px;

            padding: 12px;

            font-weight: 600;

            background: linear-gradient(135deg,
                    #38bdf8,
                    #2563eb);

            transition: .3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(37, 99, 235, .4);
        }

        /* =========================
           Resend
        ========================== */

        .resend-btn {
            background: none;
            border: none;

            color: #38bdf8;

            margin-top: 18px;

            font-weight: 600;

            transition: .3s;
        }

        .resend-btn:hover:not(:disabled) {
            color: white;
        }

        .resend-btn:disabled {
            color: #64748b;
            cursor: not-allowed;
        }

        .timer {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 13px;
        }

        /* =========================
           Mobile
        ========================== */

        @media(max-width:500px) {

            .card {
                margin: 20px;
                padding: 28px;
            }

            .otp-box {
                width: 46px;
                height: 54px;
                font-size: 20px;
            }
        }

        /* =========================
   Back Button
========================== */

        .back-btn {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            color: #e2e8f0;

            padding: 8px 14px;
            border-radius: 12px;

            font-size: 14px;
            font-weight: 600;

            transition: .3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, .1);
            color: white;
            transform: translateX(-3px);
        }
    </style>
</head>

<body>

    <!-- Animated Background -->
    <div class="bg">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div class="card">

        <!-- Back Button -->
        <div class="text-start mb-3">
            <button type="button" onclick="history.back()" class="back-btn">
                ← Back
            </button>
        </div>

        <!-- Logo -->
        <div class="logo">
            EH
        </div>

        <h3>Verify Your Email</h3>

        <p class="subtitle">
            Enter the 6-digit verification code sent to your email
        </p>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-info py-2">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST" id="otpForm">
            {% csrf_token %}

            <div class="otp-container">
                <input type="text" maxlength="1" class="otp-box" required>
                <input type="text" maxlength="1" class="otp-box" required>
                <input type="text" maxlength="1" class="otp-box" required>
                <input type="text" maxlength="1" class="otp-box" required>
                <input type="text" maxlength="1" class="otp-box" required>
                <input type="text" maxlength="1" class="otp-box" required>
            </div>

            <input type="hidden" name="otp" id="finalOtp">

            <button type="submit" class="btn btn-primary w-100">
                Verify OTP
            </button>
        </form>

        <form action="{% url 'send_otp' %}" method="POST">
            {% csrf_token %}
            <button type="submit" id="resendBtn" class="resend-btn" disabled>
                Resend OTP
            </button>
        </form>

        <div class="timer" id="timer">
            Resend available in 60 sec
        </div>

    </div>

    <script>
        const inputs = document.querySelectorAll(".otp-box");

        inputs.forEach((input, index) => {

            input.addEventListener("input", () => {

                input.value = input.value.replace(/[^0-9]/g, "");

                if (input.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener("keydown", (e) => {

                if (
                    e.key === "Backspace" &&
                    !input.value &&
                    index > 0
                ) {
                    inputs[index - 1].focus();
                }
            });
        });

        document.getElementById("otpForm")
            .addEventListener("submit", function () {

                let otp = "";

                inputs.forEach(input => otp += input.value);

                document.getElementById("finalOtp").value = otp;
            });

        let seconds = 60;

        const timer = document.getElementById("timer");
        const resendBtn = document.getElementById("resendBtn");

        const countdown = setInterval(() => {

            seconds--;

            timer.innerText =
                "Resend available in " + seconds + " sec";

            if (seconds <= 0) {

                clearInterval(countdown);

                timer.innerText =
                    "You can resend OTP now";

                resendBtn.disabled = false;
            }

        }, 1000);

        inputs[0].focus();
    </script>

</body>

</html>
