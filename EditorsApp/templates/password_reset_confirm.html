{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Set New Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(5px) brightness(60%);
            z-index: -1;
        }

        .box {
            width: 400px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #f1f1f1;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.92);
        }

        .input-group input:focus {
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.8);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #4facfe, #00c6fb);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.4);
        }

        .errorlist {
            list-style: none;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 10px;
            background: rgba(255, 0, 0, 0.15);
            color: #ffb3b3;
            font-size: 14px;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
        }

        .bottom a {
            color: #4facfe;
            text-decoration: none;
            font-size: 15px;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        .invalid-text {
            text-align: center;
            color: #ffb3b3;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <!-- Background Video -->
    <video autoplay muted loop>
        <source src="{% static 'videos/background.mp4' %}" type="video/mp4">
    </video>

    <div class="box">

        <h2>Set New Password</h2>

        {% if validlink %}

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>New Password</label>
                {{ form.new_password1 }}
            </div>

            <div class="input-group">
                <label>Confirm New Password</label>
                {{ form.new_password2 }}
            </div>

            {{ form.errors }}

            <button type="submit">
                Change Password
            </button>

        </form>

        {% else %}

        <p class="invalid-text">
            Invalid or expired password reset link.
        </p>

        {% endif %}

        <div class="bottom">
            <a href="/login/">← Back to Login</a>
        </div>

    </div>

</body>

</html>
